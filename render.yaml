services:
  # Redis service for caching and pub/sub
  - type: redis
    name: hackos-redis
    plan: free
    ipAllowList: [] # Allow all internal connections

  # Backend Web Service (FastAPI)
  - type: web
    name: hackos-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hackos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hackos-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # User can configure this in Render dashboard

  # Frontend Web Service (Next.js)
  - type: web
    name: hackos-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: hackos-backend
          type: web
          property: url
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          name: hackos-backend
          type: web
          property: url

databases:
  - name: hackos-db
    plan: free
