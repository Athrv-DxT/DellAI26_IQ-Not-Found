version: '3.8'

services:
  # Database Service
  postgres:
    image: postgres:16-alpine
    container_name: hackathon_postgres
    restart: always
    environment:
      POSTGRES_DB: hackathon_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hackathon_network

  # Cache / Message Broker / WebSocket PubSub
  redis:
    image: redis:7-alpine
    container_name: hackathon_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hackathon_network

  # Vector Database for AI embeddings
  chromadb:
    image: chromadb/chroma:latest
    container_name: hackathon_chromadb
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/data
    networks:
      - hackathon_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local

networks:
  hackathon_network:
    driver: bridge
